# CI: private data guard and app only checks. Runs on pushes to main, pull requests and by hand.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Private data guard
        run: |
          pat='192\.168\.1\.[0-9]{1,3}|myemail937|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY|rose[ _-]?engine|guilloche|gen-rose'
          if git grep -n -I -i -E "$pat" -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Private data found (lines above). Remove it before merging."
            exit 1
          fi
          echo "Guard clean."
      - name: No source or signing keys
        run: |
          bad=$(git ls-files | grep -i -E '\.(pfx|snk|cs|csproj|sln|unity|asset)$|^(Assets|Packages|ProjectSettings|Library|UWP|Build)/' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::This repo ships the sideload app only. Source, project or key files are not allowed."
            exit 1
          fi
      - name: README screenshots exist
        run: |
          missing=0
          for f in $(grep -o -E 'screenshots/[A-Za-z0-9_.-]+' README.md | sort -u); do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing
